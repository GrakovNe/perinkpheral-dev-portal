# Every push and pull request: the portal checked and built, the site as the run's artifact.
#
# Every push to main is a release, once that passes: the site published on GitHub Pages at
# perinkpheral.dev, and the next version - the last release's with its patch one up, or 0.1.0 -
# tagged, its notes the commits since the release before. The web flasher reads the firmware's
# releases from the firmware repository's Pages, not from here.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          PORTAL_BASE: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')
          next=0.1.0
          if [ -n "$last" ]; then
            IFS=. read -r major minor patch <<< "$last"
            next="$major.$minor.$((patch + 1))"
          fi
          git log --no-merges --format='- %s' ${last:+v$last..}HEAD > notes.md
          gh release create "v$next" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$next" --notes-file notes.md
