# The portal on GitHub Pages, at perinkpheral.dev: built, checked and
# published when somebody presses Run workflow - a push does not publish.
# The files of the latest firmware release go beside it, for the flasher.

name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The latest firmware release, for the web flasher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/firmware
          if gh release download --repo GrakovNe/perinkpheral --pattern manifest.json --dir public/firmware; then
            gh release download --repo GrakovNe/perinkpheral --pattern '*.bin' --dir public/firmware
          else
            echo "No firmware release with a manifest: the flasher says so."
          fi
      - run: npm run build
        env:
          PORTAL_BASE: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
